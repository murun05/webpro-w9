
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f0fdfa;
            color: #1e293b;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .error-card {
            width: min(550px, 100%);
            padding: 45px 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin: 0;
            color: #0f766e;
            font-size: 64px;
        }

        h2 {
            margin-top: 10px;
        }

        p {
            color: #475569;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 22px;
            background: #0f766e;
            color: #ffffff;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            background: #115e59;
        }
    </style>
</head>

<body>

    <main class="error-card">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>

        <p>
            Sorry, the page you are looking for doesn't exist
            or may have been moved.
        </p>

        <a href="./">← Back to Home</a>
    </main>

</body>
</html>
